name: loop-eng-se-lab

networks:
  agentnet:

volumes:
  se_artifact:

services:
  agent:
    build:
      context: .
      dockerfile: docker/se-agent.Dockerfile
    networks: [agentnet]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - se_artifact:/workspace
    command: sleep infinity

  sandbox:
    build:
      context: .
      dockerfile: docker/se-sandbox.Dockerfile
    network_mode: none
    command: sleep infinity
